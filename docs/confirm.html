<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoAffil Pro — ยืนยันอีเมล / Confirm email</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
        background: #0d1117;
        color: #e6edf3;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 28px;
        text-align: center;
      }
      .brand { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
      .brand .logo { font-size: 26px; }
      .sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
      .icon { font-size: 44px; margin: 8px 0; }
      h1 { font-size: 18px; margin: 6px 0; }
      p { margin: 8px 0; line-height: 1.55; font-size: 14px; }
      .muted { color: #8b949e; font-size: 13px; }
      .en { color: #adbac7; }
      .ok { color: #3fb950; }
      .err { color: #f85149; }
      .spinner {
        width: 34px; height: 34px; margin: 10px auto;
        border: 3px solid #30363d; border-top-color: #e5534b;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint {
        margin-top: 18px; padding: 12px; border-radius: 8px;
        background: #1f2937; border: 1px solid #30363d; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand"><span class="logo">🛒</span> AutoAffil Pro</div>
      <div class="sub">ระบบ AI ปักตะกร้า</div>
      <div id="state">
        <div class="spinner"></div>
        <h1>กำลังยืนยันอีเมล…</h1>
        <p class="en">Confirming your email…</p>
      </div>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

      // Publishable (anon) key — safe to embed in a public page by design.
      const SUPABASE_URL = 'https://jbvafinqvquedijokwgz.supabase.co'
      const SUPABASE_KEY = 'sb_publishable_HoWokOsUZJp6_Jt1emgFRA_TkpLmlzp'

      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
      const el = document.getElementById('state')

      function render(html) { el.innerHTML = html }

      function success() {
        render(`
          <div class="icon ok">✅</div>
          <h1 class="ok">ยืนยันอีเมลสำเร็จ!</h1>
          <p class="en">Your email has been confirmed!</p>
          <div class="hint">
            <p>🇹🇭 กลับไปที่ส่วนขยาย <b>AutoAffil Pro</b> แล้วกด “เข้าสู่ระบบ” ด้วยอีเมลและรหัสผ่านของคุณได้เลย — ปิดหน้านี้ได้</p>
            <p class="en">🇬🇧 Return to the <b>AutoAffil Pro</b> extension and sign in with your email and password. You can close this tab.</p>
          </div>`)
      }

      function failure(reason) {
        render(`
          <div class="icon err">⚠️</div>
          <h1 class="err">ยืนยันไม่สำเร็จ</h1>
          <p class="en">Confirmation failed</p>
          <p class="muted">${reason ? reason : ''}</p>
          <div class="hint">
            <p>🇹🇭 ลิงก์อาจหมดอายุหรือถูกใช้ไปแล้ว — กลับไปที่ส่วนขยายแล้วกด “สมัครสมาชิก” ใหม่อีกครั้งเพื่อรับอีเมลยืนยันฉบับใหม่</p>
            <p class="en">🇬🇧 The link may have expired or already been used. Go back to the extension and press “Sign up” again to get a new confirmation email.</p>
          </div>`)
      }

      async function run() {
        const params = new URLSearchParams(location.search)
        // Supabase may also put errors in the hash fragment.
        const hash = new URLSearchParams(location.hash.replace(/^#/, ''))
        const hashError = hash.get('error_description') || params.get('error_description')

        const tokenHash = params.get('token_hash')
        const type = params.get('type') || 'email'

        if (!tokenHash) {
          failure(hashError || 'ไม่พบโทเคนยืนยันในลิงก์ / No confirmation token in the link')
          return
        }

        try {
          const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type })
          if (error) failure(error.message)
          else success()
        } catch (e) {
          failure(e && e.message ? e.message : String(e))
        }
      }

      run()
    </script>
  </body>
</html>
